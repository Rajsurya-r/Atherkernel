name: AetherKernel CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest kuzu tree-sitter tree-sitter-python prometheus-client requests
      - name: Run Test Suite
        run: pytest tests/
      - name: Run Synthetic Benchmark Validation
        run: python eval_benchmarks.py