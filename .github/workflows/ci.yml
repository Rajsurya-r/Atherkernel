name: AetherKernel CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System and Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests prometheus_client kuzu pydantic fastapi uvicorn tree-sitter tree-sitter-python

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v